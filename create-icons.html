<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .instructions {
            text-align: left;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Simple placeholder icons for STFC Tracker PWA</p>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Click the buttons below to generate icon images</li>
            <li>Right-click each canvas and "Save image as..."</li>
            <li>Save as <code>icon-192.png</code> and <code>icon-512.png</code></li>
            <li>Place them in the STFCTrackerPWA folder</li>
        </ol>
    </div>
    
    <div>
        <canvas id="icon192" width="192" height="192"></canvas>
        <canvas id="icon512" width="512" height="512"></canvas>
    </div>
    
    <div>
        <button onclick="generateIcon(192)">Generate 192x192</button>
        <button onclick="generateIcon(512)">Generate 512x512</button>
        <button onclick="downloadAll()">Download Both</button>
    </div>
    
    <script>
        function generateIcon(size) {
            const canvas = document.getElementById(`icon${size}`);
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#4285f4';
            ctx.fillRect(0, 0, size, size);
            
            // Text
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${size * 0.4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('STFC', size / 2, size / 2 - size * 0.1);
            ctx.font = `bold ${size * 0.2}px Arial`;
            ctx.fillText('Tracker', size / 2, size / 2 + size * 0.1);
        }
        
        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function downloadAll() {
            generateIcon(192);
            generateIcon(512);
            setTimeout(() => {
                downloadCanvas(document.getElementById('icon192'), 'icon-192.png');
                setTimeout(() => {
                    downloadCanvas(document.getElementById('icon512'), 'icon-512.png');
                }, 500);
            }, 100);
        }
        
        // Generate on load
        window.onload = () => {
            generateIcon(192);
            generateIcon(512);
        };
    </script>
</body>
</html>
